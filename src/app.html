<!doctype html>
<html lang="en" data-theme="dark" data-palette="ice">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<meta
			name="description"
			content="An interactive developer portfolio — immersive, animated, engineered."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Portfolio" />
		<meta
			property="og:description"
			content="An interactive developer portfolio — immersive, animated, engineered."
		/>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
		/>

		<script>
			(function () {
				try {
					var storedTheme = localStorage.getItem('theme');
					var storedPalette = localStorage.getItem('palette');
					var theme =
						storedTheme === 'light' || storedTheme === 'dark'
							? storedTheme
							: window.matchMedia('(prefers-color-scheme: light)').matches
								? 'light'
								: 'dark';
					var palette = storedPalette || 'ice';
					document.documentElement.setAttribute('data-theme', theme);
					document.documentElement.setAttribute('data-palette', palette);
				} catch (e) {
					void e;
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
